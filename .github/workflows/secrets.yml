
name: Variables and Secrets Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Display Repository Variable
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          echo "App Name: $APP_NAME"
          echo "Student: Ibad ur Rehman"
          echo "SAP ID: 56468"

      - name: Test Encrypted Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret configured successfully!"
            echo "::add-mask::$MY_SECRET"
            echo "Masked Secret: $MY_SECRET"
          else
            echo "Secret not found!"
            exit 1
          fi

      - name: Test GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Testing GitHub API authentication..."
          gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
          echo "GitHub Token works successfully!"
